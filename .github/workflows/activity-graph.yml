name: GitHub Activity Graph

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-activity-graph-svg
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: purnendu-rai
          options: "bg_color=0D1117&color=a9fef7&line=fe428e&point=f8d847&area_color=fe428e&title_color=f8d847"
          output_path: activity-graph/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity-graph/activity-graph.svg
          git diff --staged --quiet || git commit -m "generated activity-graph-svg [skip ci]"
          git pull --rebase
          git push
