name: GitHub Activity Graph

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-activity-graph-svg
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: ashutosh00710/github-activity-graph@v0.1.0
        with:
          github_user: purnendu-rai
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move graph into place
        run: |
          mkdir -p activity-graph
          if [ -f github-activity-graph.svg ]; then
            mv github-activity-graph.svg activity-graph/activity-graph.svg
          fi

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity-graph/activity-graph.svg
          git diff --staged --quiet || git commit -m "generated activity-graph-svg [skip ci]"
          git pull --rebase
          git push
